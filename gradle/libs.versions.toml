# Every version this plugin applies or injects into consumer builds, plus its own build's.
# Dependabot reads this file; `generateConventionVersions` turns the injected ones into `ConventionVersions` constants.

[versions]
# Injected into consumer builds
assertj = "3.27.7"
checkstyle = "14.3.0"
errorprone = "2.50.0"
# Floor for the Checkstyle and Error Prone classpaths (CVE-2026-102554)
guava = "33.7.2-jre"
jacoco = "0.8.15"
jetbrains-annotations = "26.1.0"
jspecify = "1.0.1"
junit = "6.1.3"
lombok = "1.18.48"
nullaway = "0.14.2"
pitest = "1.30.0"
pitest-junit5-plugin = "1.2.3"
# Gradle plugins applied to consumer builds
errorprone-gradle-plugin = "5.1.1"
pitest-gradle-plugin = "1.19.0"
spotless = "8.10.3"
# This plugin's own build
kotlin-dsl = "6.7.11"
plugin-publish = "2.2.1"

[libraries]
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
checkstyle = { module = "com.puppycrawl.tools:checkstyle", version.ref = "checkstyle" }
errorprone-annotations = { module = "com.google.errorprone:error_prone_annotations", version.ref = "errorprone" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
jacoco-agent = { module = "org.jacoco:org.jacoco.agent", version.ref = "jacoco" }
jetbrains-annotations = { module = "org.jetbrains:annotations", version.ref = "jetbrains-annotations" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
pitest = { module = "org.pitest:pitest", version.ref = "pitest" }
# What the PIT Gradle plugin resolves in consumer builds; mirrored by this build's conventionPitest
pitest-command-line = { module = "org.pitest:pitest-command-line", version.ref = "pitest" }
pitest-junit5-plugin = { module = "org.pitest:pitest-junit5-plugin", version.ref = "pitest-junit5-plugin" }
errorprone-gradle-plugin = { module = "net.ltgt.gradle:gradle-errorprone-plugin", version.ref = "errorprone-gradle-plugin" }
pitest-gradle-plugin = { module = "info.solidsoft.gradle.pitest:gradle-pitest-plugin", version.ref = "pitest-gradle-plugin" }
spotless-gradle-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }

[plugins]
kotlin-dsl = { id = "org.gradle.kotlin.kotlin-dsl", version.ref = "kotlin-dsl" }
plugin-publish = { id = "com.gradle.plugin-publish", version.ref = "plugin-publish" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
