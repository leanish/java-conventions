name: Publishing GitHub Packages

# Checks, then publishes through the reusable workflow, which keeps Gradle away from the write token (see
# publishing-github-packages.yml).

on:
  workflow_dispatch:

permissions:
  contents: read

# Versions share the coordinate-level maven-metadata.xml: one run of this workflow at a time. It doesn't serialize
# against publishing from elsewhere (another workflow or a local `./gradlew publish`).
concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  check-java-25:
    name: Checking on JDK 25
    uses: ./.github/workflows/ci.yml

  test-legacy-jdk:
    name: Testing on Legacy JDKs
    uses: ./.github/workflows/testing-legacy-jdk.yml

  publish:
    name: Publish
    needs:
      - check-java-25
      - test-legacy-jdk
    # The most the reusable workflow's jobs get; each narrows it.
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publishing-github-packages.yml
    with:
      # The plugin implementation and its marker.
      coordinates: >-
        io/github/leanish/java-conventions
        io/github/leanish/java-conventions/io.github.leanish.java-conventions.gradle.plugin
      # Kotlin plugin code targets JVM 17 (its compilation toolchain); JDK 25, the last one, runs Gradle.
      java-versions: |
        17
        25
