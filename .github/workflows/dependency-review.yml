name: Dependency review

# Reviews every dependency a PR adds or changes against the GitHub Advisory Database (vulnerabilities and
# malware), from the resolved Gradle graph. Building the graph runs the build, so it gets a read-only token;
# a separate job without any build code submits it.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  dependency-graph:
    name: Dependency graph
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same JDKs as the build: 17 is the Kotlin compilation toolchain, 25 (declared last) runs Gradle.
      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25

      - name: Generate the resolved dependency graph
        uses: gradle/actions/dependency-submission@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          dependency-graph: generate-and-upload

  submit:
    name: Submit dependency graph
    needs: dependency-graph
    runs-on: ubuntu-latest
    permissions:
      # The dependency submission API needs write access; this job runs no build code.
      contents: write

    steps:
      - name: Submit the dependency graph
        uses: gradle/actions/dependency-submission@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          dependency-graph: download-and-submit

  review:
    name: Dependency review
    needs: submit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      # Every allowed advisory expires: past its date the review fails until someone looks again.
      - name: Check that allowed advisories haven't expired
        env:
          # GHSA-r937-wjx7-w2jp: Kotlin build-cache deserialization in kotlin-gradle-plugin 2.4.10, the compiler Gradle 9.8.0
          # embeds for `kotlin-dsl` (build time only, nothing we publish). Fixed in Kotlin 2.4.20, which no stable Gradle
          # embeds yet; remove it (here and below) once the wrapper moves to one that does.
          KOTLIN_BUILD_CACHE_EXPIRES: "2026-11-15"
        run: |
          if [[ "$(date -u +%F)" > "$KOTLIN_BUILD_CACHE_EXPIRES" ]]; then
            echo "::error::the allowance for GHSA-r937-wjx7-w2jp expired on $KOTLIN_BUILD_CACHE_EXPIRES"
            exit 1
          fi

      - name: Review added and changed dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          fail-on-scopes: runtime, development, unknown
          retry-on-snapshot-warnings: true
          allow-ghsas: GHSA-r937-wjx7-w2jp
