name: Dependency review

# Submits the resolved Gradle dependency graph to GitHub's dependency graph (which feeds Dependabot alerts); it
# doesn't review or block anything. The advisory gate on PRs is the supply-chain workflow. Building the graph runs
# the build, so it gets a read-only token; a separate job without any build code submits it.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  dependency-graph:
    name: Dependency graph
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same JDKs as the build: 17 is the Kotlin compilation toolchain, 25 (declared last) runs Gradle.
      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25

      - name: Generate the resolved dependency graph
        uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          dependency-graph: generate-and-upload

  submit:
    name: Submit dependency graph
    needs: dependency-graph
    # A pull request from a fork gets a read-only token whatever the job asks for, so it can't submit; it skips this job
    # instead of failing. Its dependencies are submitted from main once it's merged.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    permissions:
      # The dependency submission API needs write access; this job runs no build code.
      contents: write

    steps:
      - name: Submit the dependency graph
        uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          dependency-graph: download-and-submit
