name: Testing Legacy JDK

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test-lts:
    name: Build (JDK ${{ matrix.java-version }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        java-version: [17, 21]

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK ${{ matrix.java-version }} (test runtime)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}

      # Kotlin plugin code targets JVM 17; JDK 17 is needed as the Kotlin compilation toolchain.
      - name: Set up JDK 17 (Kotlin compilation toolchain)
        if: matrix.java-version != 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17

      # Last declaration becomes default and therefore the Gradle runtime JDK.
      - name: Set up JDK 25 (Gradle runtime + Java toolchain/tests)
        if: matrix.java-version != 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Check
        run: ./gradlew check -PjavaConventions.runtimeJdkVersion=${{ matrix.java-version }}

      - name: Upload build artifacts on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: legacy-build-artifacts-jdk-${{ matrix.java-version }}
          path: |
            build/test-results/**
            build/reports/**
