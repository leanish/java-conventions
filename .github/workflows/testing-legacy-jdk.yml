name: Testing Legacy JDK

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test-lts:
    name: Build (JDK ${{ matrix.java-version }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        java-version: [17, 21]

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The matrix JDK runs the tests, 17 is the Kotlin compilation toolchain (the plugin targets JVM 17), and 25,
      # declared last, runs Gradle. On the 17 leg, 17 is listed twice.
      - name: Set up JDKs ${{ matrix.java-version }}, 17 and 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: |
            ${{ matrix.java-version }}
            17
            25

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Check
        run: ./gradlew check -PjavaConventions.runtimeJdkVersion=${{ matrix.java-version }}

      - name: Upload build artifacts on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: legacy-build-artifacts-jdk-${{ matrix.java-version }}
          path: |
            build/test-results/**
            build/reports/**
