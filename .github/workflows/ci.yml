name: Build

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      # Kotlin plugin code targets JVM 17; JDK 17 is needed as the Kotlin compilation toolchain.
      - name: Set up JDK 17 (Kotlin compilation toolchain)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Tests/Java toolchain tasks use JDK 25
      # JDK declaration order matters as the last one declared will be the default one (thus used to run Gradle itself)
      - name: Set up JDK 25 (Gradle runtime + Java toolchain/tests)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Build
        run: ./gradlew build

      - name: Upload build artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts-jdk-25
          path: |
            build/test-results/**
            build/reports/**
